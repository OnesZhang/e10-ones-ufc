<style>
:host{--header-bg:#a0c0e0;--safe-bg:#f2f9f0;--safe-border:#2e7d32;--safe-text:#2e7d32;--unsafe-text:#c62828;--gray-text:#666;--gray-border:#d1d5db}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ufc-root{padding:20px;background-color:#fff;display:flex;justify-content:center}
.wrapper{max-width:1000px;width:100%}
.container{display:flex;gap:20px}
.column{flex:1;display:flex;flex-direction:column}
.header{background-color:var(--header-bg);color:#fff;text-align:center;font-weight:bold;padding:10px;border-radius:4px 4px 0 0;font-size:16px}
.card{display:flex;align-items:center;padding:20px;border-radius:8px;margin-top:10px;position:relative;flex:1}
.card.safe{background-color:var(--safe-bg);border:2px solid var(--safe-border)}
.card.safe h2,.card.safe h3{color:var(--safe-text)}
.card.safe .main-icon-bg{background-color:#2e7d32}
.card.safe .status-icon:not(.unselected){background-color:#2e7d32}
.card.unsafe{background-color:#fff;border:2px solid var(--gray-border)}
.card.unsafe h2,.card.unsafe h3{color:var(--unsafe-text)}
.card.unsafe .main-icon-bg{background-color:#c62828}
.card.unsafe .status-icon:not(.unselected){background-color:#c62828}
.main-icon-bg{width:64px;height:64px;border-radius:50%;display:flex;justify-content:center;align-items:center;margin-right:16px;flex-shrink:0}
.main-icon-bg svg{width:32px;height:32px;fill:#fff}
.card-content{flex-grow:1}
.card-content h2{font-size:22px;margin:0 0 2px 0}
.card-content h3{font-size:18px;margin:0 0 4px 0;font-weight:700}
.card-content p{font-size:13px;color:var(--gray-text);margin:0}
.status-icon{width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center;margin-left:10px;flex-shrink:0}
.status-icon svg{width:16px;height:16px;fill:#fff}
.status-icon.unselected{background-color:transparent;border:2px solid #9ca3af}
.status-icon.unselected svg{display:none}
.footer-container{display:flex;justify-content:space-between;margin-top:8px;padding:0 4px}
.footer-text{font-size:12px;color:var(--gray-text)}
.footer-text.right{text-align:right;direction:rtl}
@media (max-width:768px){.container{flex-direction:column;gap:16px}.footer-container{flex-direction:column;gap:8px;margin-top:16px;padding:0 8px}.footer-text.right{text-align:left}}
</style>
